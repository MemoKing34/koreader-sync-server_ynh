pid tmp/{{GIN_ENV}}-nginx.pid;

# run in foreground, systemd supervises the process
daemon off;

worker_processes 2;

# let nginx workers inherit these variables from the systemd unit
env ENABLE_USER_REGISTRATION;
env GIN_ENV;

events {
    worker_connections 1024;
}

http {
    sendfile on;

    # Gin initialization
    {{GIN_INIT}}

    # HTTP only, bound to localhost: TLS is handled by YunoHost's nginx
    server {
        listen 127.0.0.1:{{GIN_PORT}};

        keepalive_timeout 70;

        # Gin runtime
        {{GIN_RUNTIME}}

        access_log logs/{{GIN_ENV}}-access.log combined buffer=16k;
        error_log logs/{{GIN_ENV}}-error.log warn;
    }
}
