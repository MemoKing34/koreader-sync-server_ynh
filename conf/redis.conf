# Dedicated Redis instance for __APP__ (keeps its data inside the app's data dir,
# so it is included in YunoHost backups)
bind 127.0.0.1
port __PORT_REDIS__
protected-mode yes
daemonize no
supervised systemd
loglevel notice
logfile ""
databases 5

dir __DATA_DIR__/redis
dbfilename dump.rdb
save 900 1
save 300 10
save 60 10000

appendonly yes
appendfilename "appendonly.aof"
appendfsync everysec
