#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "koreader-sync-server"
name = "KOReader Sync Server"
description.en = "Self-hosted synchronization service for KOReader devices"

tags = ["reading", "synchronization", "api"]

version = "2.1.1~ynh1"

maintainers = ["MemoKing34"]

[upstream]
license = "AGPL-3.0"
website = "https://github.com/koreader/koreader-sync-server"
code = "https://github.com/koreader/koreader-sync-server"

[integration]
yunohost = ">= 12.1.17"
helpers_version = "2.1"
architectures = ["amd64", "arm64", "armhf"]
multi_instance = false
ldap = false
sso = false
disk = "500M"
ram.build = "1G"
ram.runtime = "150M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/koreader"

    [install.init_main_permission]
    type = "group"
    default = "visitors"

    [install.enable_user_registration]
    ask.en = "Allow new KOReader users to register on this server?"
    type = "boolean"
    default = true

[resources]
    [resources.sources]

    [resources.sources.main]
    url = "https://github.com/koreader/koreader-sync-server/archive/refs/tags/v2.1.1.tar.gz"
    sha256 = "a5373c679ebcf9e0877b1572970ca896ac241d04ed7723439813dee74bdb383e"
    autoupdate.strategy = "latest_github_tag"

    [resources.sources.openresty]
    url = "https://github.com/openresty/openresty/archive/refs/tags/v1.29.2.3.tar.gz"
    sha256 = "1b9dbb3c2a428559b67f951f49ac68858426a423a10e0253030acda4ab2f6d7a"

    [resources.sources.gin]
    url = "https://github.com/ostinelli/gin/archive/cb35e87fa0671fcf25e5bce5cb9487dee8b497e2.tar.gz"
    sha256 = "572093b32acf3bfccde1fa3de52160ccc37a98f3ce22d5ad04fdd6ca8355dcda"

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]

    [resources.permissions]
    main.url = "/"

    [resources.ports]
    main.default = 17200
    redis.default = 16379

    [resources.apt]
    packages = "ca-certificates, curl, patch, build-essential, libreadline-dev, libncurses5-dev, libpcre2-dev, libssl-dev, zlib1g-dev, luarocks, redis-server, openssl"
