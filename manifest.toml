#:schema https://raw.githubusercontent.com/YunoHost/apps/main/schemas/manifest.v2.schema.json

packaging_format = 2

id = "koreader-sync-server"
name = "KOReader Sync Server"
description.en = "Synchronize reading progress between your KOReader devices"
description.fr = "Synchronisez votre progression de lecture entre vos appareils KOReader"

version = "2.1.1~ynh2"

maintainers = ["MemoKing34"]

[upstream]
license = "AGPL-3.0-only"
code = "https://github.com/koreader/koreader-sync-server"

[integration]
yunohost = ">= 13.0"
helpers_version = "2.1"
architectures = ["amd64", "arm64"]
multi_instance = true
ldap = false
sso = false
disk = "600M"
ram.build = "200M"
ram.runtime = "100M"

[install]
    [install.domain]
    type = "domain"

    [install.path]
    type = "path"
    default = "/kosync"

    [install.enable_user_registration]
    ask.en = "Allow new KOReader users to register on this server?"
    ask.fr = "Autoriser l'inscription de nouveaux utilisateurs KOReader sur ce serveur ?"
    help.en = "You can change this later in the app's configuration panel."
    help.fr = "Vous pourrez modifier ce choix plus tard dans le panneau de configuration de l'application."
    type = "boolean"
    default = true

[resources]
    [resources.sources]

        # Prebuilt upstream image koreader/kosync:v2.1.1 (app + OpenResty + gin),
        # unpacked by docker-image-extract: no Docker on the server and no
        # local compilation. Pinned by per-architecture manifest digests
        # (docker-image-extract cannot select a platform from a multi-arch
        # index digest). ynh_setup_source requires a sha256 value but does not
        # check it for docker sources, so it repeats the digest.
        [resources.sources.main]
        format = "docker"
        prefetch = false
        amd64.url = "koreader/kosync:sha256:c9cd8976986e0a2893f47a203638bbd68335bb6e93f9045babbb7d83cf63549c"
        amd64.sha256 = "c9cd8976986e0a2893f47a203638bbd68335bb6e93f9045babbb7d83cf63549c"
        arm64.url = "koreader/kosync:sha256:b7769cea99632ce0ad2d66c03b01b79eb4541eff47f98d0e05a5a4d8bc783e9e"
        arm64.sha256 = "b7769cea99632ce0ad2d66c03b01b79eb4541eff47f98d0e05a5a4d8bc783e9e"

    [resources.system_user]

    [resources.install_dir]

    [resources.data_dir]
    subdirs = ["redis"]

    [resources.permissions]
    main.url = "/"
    main.allowed = "visitors"
    main.show_tile = false
    main.auth_header = false
    main.protected = true

    [resources.ports]
    main.default = 7200
    redis.default = 6380

    [resources.apt]
    packages = "lua5.1, redis-server"
